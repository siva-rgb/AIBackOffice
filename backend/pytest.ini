[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers

# Pinned deliberately: pytest-asyncio warns that the default is unset and will
# change in a future release. Pinning it now means an upgrade cannot silently
# alter fixture lifetimes underneath the suite.
asyncio_default_fixture_loop_scope = function
