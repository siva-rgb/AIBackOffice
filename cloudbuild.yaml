# Cloud Build → Cloud Run for both Kora services.
#
# Order matters: the backend deploys FIRST so its public URL can be baked into
# the frontend image as NEXT_PUBLIC_API_URL (Next inlines NEXT_PUBLIC_* at build
# time — it is NOT a runtime env var). See DEPLOY.md.
#
# Trigger manually:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_FRONTEND_ORIGIN=https://app.example.com,\
# _NEXT_PUBLIC_SUPABASE_URL=...,_NEXT_PUBLIC_SUPABASE_ANON_KEY=...,\
# _NEXT_PUBLIC_STRIPE_STARTER_PRICE_ID=...,_NEXT_PUBLIC_STRIPE_PRO_PRICE_ID=...
#
# Runtime secrets (MODEL_API_KEY, SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY,
# TOKEN_ENCRYPTION_KEY, …) are NOT set here — bind them from Secret Manager on
# the backend service (see DEPLOY.md), never baked into an image.

substitutions:
  _REGION: us-central1
  _REPO: kora
  _BACKEND_SERVICE: kora-backend
  _FRONTEND_SERVICE: kora-frontend
  _FRONTEND_ORIGIN: ""          # e.g. https://kora-frontend-xxxx-uc.a.run.app
  _MODEL_NAME: "gemini-2.5-flash"
  # Keep one instance warm. Cloud Run scales to zero by default, and a cold
  # start on this image measured ~20s — paid by whoever arrives after a quiet
  # period, which for a public deployment is most first impressions.
  # minScale is applied PER REVISION: setting it on the service alone does not
  # touch revisions already serving traffic, so it belongs in the deploy.
  _MIN_INSTANCES: "1"
  # $SHORT_SHA is only populated for trigger-driven builds; manual
  # `gcloud builds submit` would resolve it to an empty tag. Pass _TAG explicitly.
  _TAG: "manual"
  # 'staging' or 'production' — drives CORS behaviour in app/main.py.
  _ENVIRONMENT: "production"
  # Tenants that many people share one login to (the published demo account).
  # Account erasure is refused for these — see routers/account.py. Empty by
  # default so a private deployment never restricts a real user's deletion.
  _PROTECTED_TENANT_IDS: ""
  # Tenant that scheduled cron runs act for (see app/dependencies.py).
  _SCHEDULER_USER_ID: ""
  # Plan granted to new accounts on signup ("pro" for the evaluation deploy).
  _SIGNUP_PLAN: ""
  # Populate a brand-new tenant with the sample business on onboarding
  # completion. "true" only for public evaluation deployments — see
  # services/sample_data.py.
  _SEED_SAMPLE_DATA_ON_SIGNUP: "false"
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  _NEXT_PUBLIC_STRIPE_STARTER_PRICE_ID: ""
  _NEXT_PUBLIC_STRIPE_PRO_PRICE_ID: ""

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_BACKEND_SERVICE}:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:${_TAG}"

steps:
  # 1. Build + push the backend image.
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_BACKEND_SERVICE}:${_TAG}"
      - ./backend

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_BACKEND_SERVICE}:${_TAG}"]

  # 2. Deploy the backend FIRST so we can read its URL for the frontend build.
  #
  # Runtime secrets are bound from Secret Manager via ops/secrets.sh — the same
  # list ops/gcp_bootstrap.sh populates and ops/deploy.sh uses. Without them the
  # backend fails closed at import (no TOKEN_ENCRYPTION_KEY) and the revision
  # never becomes ready.
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        . ops/secrets.sh
        SECRET_FLAG="$$(kora_secret_flag "$PROJECT_ID")"
        gcloud run deploy ${_BACKEND_SERVICE} \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_BACKEND_SERVICE}:${_TAG}" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --no-cpu-throttling \
          --min-instances=${_MIN_INSTANCES} \
          --set-env-vars="^@^ENVIRONMENT=${_ENVIRONMENT}@ALLOW_DEMO_USER=false@KORA_DATA_BACKEND=supabase@FRONTEND_ORIGIN=${_FRONTEND_ORIGIN}@KORA_AI_BACKEND=vertex@MODEL_NAME=${_MODEL_NAME}@GOOGLE_CLOUD_PROJECT_ID=$PROJECT_ID@GOOGLE_CLOUD_LOCATION=${_REGION}@PROTECTED_TENANT_IDS=${_PROTECTED_TENANT_IDS}@SEED_SAMPLE_DATA_ON_SIGNUP=${_SEED_SAMPLE_DATA_ON_SIGNUP}@SCHEDULER_USER_ID=${_SCHEDULER_USER_ID}@SIGNUP_PLAN=${_SIGNUP_PLAN}" \
          "$$SECRET_FLAG"

  # 3. Capture the backend URL into a workspace file for the next step.
  - id: read-backend-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud run services describe ${_BACKEND_SERVICE} --region=${_REGION} \
          --format='value(status.url)' > /workspace/backend_url.txt
        echo "backend URL: $$(cat /workspace/backend_url.txt)"

  # 4. Build + push the frontend, baking the backend URL as NEXT_PUBLIC_API_URL.
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - "-c"
      - |
        BACKEND_URL="$$(cat /workspace/backend_url.txt)"
        # _FRONTEND_ORIGIN is a comma-separated CORS allow-list (one deployment
        # answers on both its legacy *.a.run.app and its newer *.run.app name).
        # NEXT_PUBLIC_APP_URL is a single URL the app builds links from, so take
        # the first entry — the canonical public address — not the whole list.
        # Two steps on purpose: ${_FRONTEND_ORIGIN} is a Cloud Build
        # substitution, not a shell variable, so it cannot be expanded with
        # bash's %% operator directly. Land it in a shell variable first.
        ORIGINS="${_FRONTEND_ORIGIN}"
        APP_URL="$${ORIGINS%%,*}"
        docker build \
          --build-arg NEXT_PUBLIC_API_URL="$$BACKEND_URL" \
          --build-arg NEXT_PUBLIC_APP_URL="$$APP_URL" \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="${_NEXT_PUBLIC_SUPABASE_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${_NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
          --build-arg NEXT_PUBLIC_STRIPE_STARTER_PRICE_ID="${_NEXT_PUBLIC_STRIPE_STARTER_PRICE_ID}" \
          --build-arg NEXT_PUBLIC_STRIPE_PRO_PRICE_ID="${_NEXT_PUBLIC_STRIPE_PRO_PRICE_ID}" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:${_TAG}" \
          ./frontend

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:${_TAG}"]

  # 5. Deploy the frontend.
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:${_TAG}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"

options:
  logging: CLOUD_LOGGING_ONLY
