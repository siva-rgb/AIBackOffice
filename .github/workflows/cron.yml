name: Kora scheduled agent runs

# Fires the scheduled agent endpoints on the deployed backend.
#
# Requires two REPOSITORY secrets (Settings ▸ Secrets and variables ▸ Actions):
#   KORA_API_URL     — the backend service URL, e.g. https://kora-backend-xxxx-uc.a.run.app
#   KORA_CRON_SECRET — must match CRON_SECRET on the deployed backend
#
# Repository, not environment. This workflow deliberately declares no
# `environment:`, so the secrets that deploy.yml reads from the staging and
# production environments are NOT visible here. Putting these two in an
# environment instead is the failure mode that made every job expand the URL to
# an empty string and exit 3.
#
# Every job delegates to .github/scripts/cron-call.sh — see that file for why
# the call needs a request body and an explicit secret check.

on:
  schedule:
    # Supervisor full pass — 7:00 UTC daily (detects overdue, queues tasks, briefing)
    - cron: "0 7 * * *"
    # Butler morning briefing — 7:30 UTC Mon–Fri
    - cron: "30 7 * * 1-5"
    # Invoice follow-up campaign — 9:00 UTC Mon–Fri
    - cron: "0 9 * * 1-5"
    # Stripe payment sync — 6:20 UTC daily. Runs BEFORE the briefings and the
    # supervisor so the money they reason over includes what clients paid
    # overnight; without it the books only moved when someone clicked Sync.
    - cron: "20 6 * * *"
    # Gmail client-email intel refresh — 6:30 UTC daily (before the briefings)
    - cron: "30 6 * * *"
    # Drive intel sync (transcripts + docs) — 6:45 UTC daily
    - cron: "45 6 * * *"
    # Graph memory sync (rebuild relationship graph) — 6:50 UTC daily (before briefings)
    - cron: "50 6 * * *"
    # Semantic memory reindex (embed new learned facts/intel) — 6:55 UTC daily
    - cron: "55 6 * * *"
    # Notion ingest (read selected pages into semantic memory) — 7:10 UTC daily
    - cron: "10 7 * * *"
    # Client view fan-out (recompose per-client one-pagers) — 7:20 UTC daily,
    # after delivery/money/notion data is fresh
    - cron: "20 7 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run manually"
        required: true
        default: supervisor
        type: choice
        options: [supervisor, butler, invoices, stripe, gmail, drive, graph, memory, notion, client_views, all]

jobs:
  supervisor:
    if: >
      github.event_name == 'workflow_dispatch' && (inputs.job == 'supervisor' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '0 7')
    runs-on: ubuntu-latest
    env:
      KORA_API_URL: ${{ secrets.KORA_API_URL }}
      KORA_CRON_SECRET: ${{ secrets.KORA_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Run supervisor pass
        run: .github/scripts/cron-call.sh /api/manager/run

  butler:
    if: >
      github.event_name == 'workflow_dispatch' && (inputs.job == 'butler' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '30 7')
    runs-on: ubuntu-latest
    env:
      KORA_API_URL: ${{ secrets.KORA_API_URL }}
      KORA_CRON_SECRET: ${{ secrets.KORA_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Run butler morning briefing
        run: .github/scripts/cron-call.sh /api/butler/run

  invoices:
    if: >
      github.event_name == 'workflow_dispatch' && (inputs.job == 'invoices' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '0 9')
    runs-on: ubuntu-latest
    env:
      KORA_API_URL: ${{ secrets.KORA_API_URL }}
      KORA_CRON_SECRET: ${{ secrets.KORA_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Run invoice follow-up campaign
        # Path is /follow-up — the workflow asked for /run-follow-ups, which no
        # route ever answered, so this job returned 405 rather than running.
        run: .github/scripts/cron-call.sh /api/invoices/follow-up

  stripe:
    if: >
      github.event_name == 'workflow_dispatch' && (inputs.job == 'stripe' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '20 6')
    runs-on: ubuntu-latest
    env:
      KORA_API_URL: ${{ secrets.KORA_API_URL }}
      KORA_CRON_SECRET: ${{ secrets.KORA_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync Stripe payments into the books
        run: .github/scripts/cron-call.sh /api/stripe-connect/run

  gmail:
    if: >
      github.event_name == 'workflow_dispatch' && (inputs.job == 'gmail' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '30 6')
    runs-on: ubuntu-latest
    env:
      KORA_API_URL: ${{ secrets.KORA_API_URL }}
      KORA_CRON_SECRET: ${{ secrets.KORA_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Gmail client-email intel sync
        run: .github/scripts/cron-call.sh /api/gmail/run

  drive:
    if: >
      github.event_name == 'workflow_dispatch' && (inputs.job == 'drive' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '45 6')
    runs-on: ubuntu-latest
    env:
      KORA_API_URL: ${{ secrets.KORA_API_URL }}
      KORA_CRON_SECRET: ${{ secrets.KORA_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Drive intel sync
        run: .github/scripts/cron-call.sh /api/drive/run

  graph:
    if: >
      github.event_name == 'workflow_dispatch' && (inputs.job == 'graph' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '50 6')
    runs-on: ubuntu-latest
    env:
      KORA_API_URL: ${{ secrets.KORA_API_URL }}
      KORA_CRON_SECRET: ${{ secrets.KORA_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Run graph memory sync
        run: .github/scripts/cron-call.sh /api/graph/run

  memory:
    if: >
      github.event_name == 'workflow_dispatch' && (inputs.job == 'memory' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '55 6')
    runs-on: ubuntu-latest
    env:
      KORA_API_URL: ${{ secrets.KORA_API_URL }}
      KORA_CRON_SECRET: ${{ secrets.KORA_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Run semantic memory reindex
        run: .github/scripts/cron-call.sh /api/memory/reindex

  notion:
    if: >
      github.event_name == 'workflow_dispatch' && (inputs.job == 'notion' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '10 7')
    runs-on: ubuntu-latest
    env:
      KORA_API_URL: ${{ secrets.KORA_API_URL }}
      KORA_CRON_SECRET: ${{ secrets.KORA_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Ingest Notion pages into semantic memory (read-only)
        run: .github/scripts/cron-call.sh /api/notion/run

  client_views:
    if: >
      github.event_name == 'workflow_dispatch' && (inputs.job == 'client_views' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '20 7')
    runs-on: ubuntu-latest
    env:
      KORA_API_URL: ${{ secrets.KORA_API_URL }}
      KORA_CRON_SECRET: ${{ secrets.KORA_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Recompose per-client views (PM agent fan-out)
        run: .github/scripts/cron-call.sh /api/clients/views/refresh-all
