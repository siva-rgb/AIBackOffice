name: Tests

# Runs lint, typecheck, and tests on every push / PR.
# The backend suite is hermetic: conftest.py forces KORA_DATA_BACKEND=mock
# and blanks all credentials before any app import — no secrets needed.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 app

      - name: Format check (black)
        run: black app --check --line-length=155

      - name: Typecheck (mypy)
        # NOTE: 218 pre-existing mypy errors surface on this codebase (mostly
        # `dict[str, Any]` annotation drift across the supabase_store / playbook
        # / supervisors). M2 does not require zero mypy — that bar belongs to a
        # dedicated cleanup milestone — but surfacing them matters so contributors
        # see the drift. `|| true` keeps the step non-blocking until the cleanup
        # lands; revisit once a milestone owns zero-mypy as its gate.
        run: mypy app --ignore-missing-imports --no-strict-optional || true

      - name: Run tests with coverage
        env:
          KORA_DATA_BACKEND: mock
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=39

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (jest)
        run: npm test -- --passWithNoTests
